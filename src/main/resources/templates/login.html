<!DOCTYPE html>
<html>
<head>
    <title>Login User</title>
</head>
<body>

<h1>Login</h1>

<form action="/auth/login" method="post">
    <b>Email:</b>
    <input type="email" name="email"><br><br>

    <b>Password:</b>
    <input type="password" name="password"><br><br>

    <button type="submit">Login</button><br>
    <a href="/auth/register">Register</a>
</form>

</body>
</html>
